<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — SWSL U15 Boys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .schedule-group { margin-bottom: 28px; }
    .schedule-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .schedule-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      gap: 16px;
      transition: border-color 0.15s;
    }
    .schedule-row:hover { border-color: var(--border-light); }
    .schedule-row.your-game {
      border-left: 3px solid var(--accent);
    }
    .schedule-teams {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
    }
    .schedule-vs {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .schedule-time {
      color: var(--text-secondary);
      font-size: 13px;
      min-width: 80px;
      text-align: center;
    }
    .schedule-location {
      color: var(--text-secondary);
      font-size: 13px;
    }
    .schedule-location a { color: var(--text-secondary); }
    .schedule-location a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">SWSL <span class="accent">U15 Boys</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="standings.html">Standings</a>
        <a href="schedule.html" class="active">Schedule</a>
      </div>
      <div class="team-selector">
        <label for="team-select">Your Team</label>
        <select id="team-select">
          <option value="western-valley">Western Valley</option>
          <option value="fdsa">FDSA</option>
          <option value="charlotte">Charlotte Saints</option>
          <option value="fundy">Fundy Mustangs</option>
          <option value="oasa">OASA</option>
          <option value="hampton">Hampton</option>
        </select>
      </div>
    </div>
  </nav>

  <header class="hero" style="padding: 36px 24px;">
    <div class="hero-content">
      <h1 style="font-size: 32px;">Schedule</h1>
      <p class="hero-sub">Remaining Games &mdash; SWSL U15 Boys</p>
    </div>
  </header>

  <section class="section">
    <div class="container" id="schedule-container"></div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>Built by <strong>High Tide Studios</strong></p>
      <p class="footer-sub">Data sourced from Soccer NB</p>
    </div>
  </footer>

  <script>
    const SCHEDULE = [
      { date: '2026-08-04', home: 'OASA', homeKey: 'oasa', away: 'Hampton', awayKey: 'hampton', time: '6:30 PM', location: 'Mackenzie Grass Field', map: 'https://www.google.ca/maps/place/45.846218109131,-66.475318908691' },
      { date: '2026-08-04', home: 'FDSA', homeKey: 'fdsa', away: 'Charlotte Saints', awayKey: 'charlotte', time: '7:00 PM', location: 'Grant Harvey Turf', map: '' },
      { date: '2026-08-04', home: 'Fundy Mustangs', homeKey: 'fundy', away: 'Western Valley', awayKey: 'western-valley', time: '7:00 PM', location: 'Usher Miller Field #1 (KVHS)', map: 'https://www.google.ca/maps/place/45.424880981445,-65.944892883301' },
      { date: '2026-08-06', home: 'Hampton', homeKey: 'hampton', away: 'Western Valley', awayKey: 'western-valley', time: '7:15 PM', location: 'Hampton High School', map: 'https://www.google.ca/maps/place/45.519031524658,-65.836601257324' },
    ];

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const yourTeam = localStorage.getItem('swsl-team') || 'western-valley';

      const grouped = {};
      SCHEDULE.forEach(g => {
        if (!grouped[g.date]) grouped[g.date] = [];
        grouped[g.date].push(g);
      });

      container.innerHTML = Object.entries(grouped).map(([date, games]) => {
        const dateObj = new Date(date + 'T12:00:00');
        const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

        const rows = games.map(g => {
          const isYourGame = g.homeKey === yourTeam || g.awayKey === yourTeam;
          const locLink = g.map ? `<a href="${g.map}" target="_blank">${g.location}</a>` : g.location;

          return `
            <div class="schedule-row ${isYourGame ? 'your-game' : ''}">
              <div class="schedule-teams">
                <span>${g.home}</span>
                <span class="schedule-vs">vs</span>
                <span>${g.away}</span>
              </div>
              <div class="schedule-time">${g.time}</div>
              <div class="schedule-location">${locLink}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="schedule-group">
            <div class="schedule-date">${dateStr}</div>
            ${rows}
          </div>
        `;
      }).join('');
    }

    const sel = document.getElementById('team-select');
    if (sel) {
      sel.value = localStorage.getItem('swsl-team') || 'western-valley';
      sel.addEventListener('change', (e) => {
        localStorage.setItem('swsl-team', e.target.value);
        const colors = { 'western-valley': '#E63946', 'fdsa': '#FFD600', 'charlotte': '#1A1A1A', 'fundy': '#1565C0', 'oasa': '#FFC107', 'hampton': '#9E9E9E' };
        document.documentElement.style.setProperty('--accent', colors[e.target.value]);
        document.documentElement.style.setProperty('--accent-dim', colors[e.target.value] + '14');
        document.documentElement.style.setProperty('--accent-mid', colors[e.target.value] + '40');
        renderSchedule();
      });
    }

    const initColors = { 'western-valley': '#E63946', 'fdsa': '#FFD600', 'charlotte': '#1A1A1A', 'fundy': '#1565C0', 'oasa': '#FFC107', 'hampton': '#9E9E9E' };
    const initTeam = localStorage.getItem('swsl-team') || 'western-valley';
    document.documentElement.style.setProperty('--accent', initColors[initTeam]);
    document.documentElement.style.setProperty('--accent-dim', initColors[initTeam] + '14');
    document.documentElement.style.setProperty('--accent-mid', initColors[initTeam] + '40');

    renderSchedule();
  </script>
</body>
</html>
