<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings — SWSL U15 Boys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">SWSL <span class="accent">U15 Boys</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="standings.html" class="active">Standings</a>
        <a href="schedule.html">Schedule</a>
      </div>
      <div class="team-selector">
        <label for="team-select">Your Team</label>
        <select id="team-select">
          <option value="western-valley">Western Valley</option>
          <option value="fdsa">FDSA</option>
          <option value="charlotte">Charlotte Saints</option>
          <option value="fundy">Fundy Mustangs</option>
          <option value="oasa">OASA</option>
          <option value="hampton">Hampton</option>
        </select>
      </div>
    </div>
  </nav>

  <header class="hero" style="padding: 36px 24px;">
    <div class="hero-content">
      <h1 style="font-size: 32px;">Standings</h1>
      <p class="hero-sub">SWSL U15 Boys Division 1 &mdash; Regular Season</p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="table-wrap">
        <table class="standings-table">
          <thead>
            <tr>
              <th class="pos">#</th>
              <th class="team-col">Team</th>
              <th>P</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
              <th class="pts-col">PTS</th>
            </tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
      <div style="margin-top:16px; display:flex; gap:20px; color:var(--text-secondary); font-size:12px; flex-wrap:wrap;">
        <span><strong>P</strong> Played</span>
        <span><strong>W</strong> Won</span>
        <span><strong>D</strong> Drawn</span>
        <span><strong>L</strong> Lost</span>
        <span><strong>GF</strong> Goals For</span>
        <span><strong>GA</strong> Goals Against</span>
        <span><strong>GD</strong> Goal Difference</span>
        <span><strong>PTS</strong> Points</span>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>Built by <strong>High Tide Studios</strong></p>
      <p class="footer-sub">Data sourced from Soccer NB</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
